
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Super Desmos Advanced</title>

  <!-- =====================================================
       DESMOS API
       Replace YOUR_DESMOS_API_KEY with your valid API key
       ===================================================== -->
  <script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=e0d65a99bdb043edb2506f57f70be22a"></script>

  <style>
    :root {
      --bg: #0d1117;
      --sidebar-bg: #161b22;
      --text: #c9d1d9;
      --border: #30363d;
      --primary: #58a6ff;
      --btn-bg: #21262d;
      --btn-hover: #30363d;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --sidebar-bg: #f6f8fa;
      --text: #24292f;
      --border: #d0d7de;
      --primary: #0969da;
      --btn-bg: #ebf0f4;
      --btn-hover: #d0d7de;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      transition: background 0.25s ease, color 0.25s ease;
    }

    /* =====================================================
       NAVBAR
       ===================================================== */

    .navbar {
      height: 58px;
      min-height: 58px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 16px;

      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border);

      z-index: 200;
    }

    .nav-left,
    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* =====================================================
       BUTTONS
       ===================================================== */

    .btn {
      background: var(--btn-bg);
      color: var(--text);

      padding: 8px 12px;

      border: 1px solid var(--border);
      border-radius: 6px;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.1s ease;
    }

    .btn:hover {
      background: var(--btn-hover);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .menu-toggle {
      display: none;

      width: 40px;
      height: 40px;

      background: transparent;
      color: var(--text);

      border: none;
      border-radius: 6px;

      font-size: 24px;
      cursor: pointer;
    }

    .menu-toggle:hover {
      background: var(--btn-hover);
    }

    /* =====================================================
       MAIN LAYOUT
       ===================================================== */

    .main-container {
      display: flex;

      flex: 1;
      min-height: 0;

      overflow: hidden;

      position: relative;
    }

    /* =====================================================
       SIDEBAR
       ===================================================== */

    .sidebar {
      width: 330px;
      min-width: 330px;

      padding: 18px;

      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);

      overflow-y: auto;

      display: flex;
      flex-direction: column;
      gap: 20px;

      transition: transform 0.3s ease;

      z-index: 150;
    }

    .category {
      width: 100%;
    }

    .category-title {
      font-size: 12px;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: 0.5px;

      padding-bottom: 7px;

      border-bottom: 1px solid var(--border);

      opacity: 0.8;
    }

    .preset-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-top: 10px;
    }

    .preset-grid .btn {
      width: 100%;
      min-height: 40px;
    }

    /* =====================================================
       CALCULATOR
       ===================================================== */

    .plot-container {
      position: relative;

      flex: 1;

      min-width: 0;
      min-height: 0;

      background: white;
    }

    #calculator {
      position: absolute;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      width: 100%;
      height: 100%;
    }

    /* =====================================================
       STATUS
       ===================================================== */

    .status {
      position: absolute;

      left: 12px;
      bottom: 12px;

      z-index: 20;

      padding: 7px 11px;

      border-radius: 6px;

      background: rgba(0, 0, 0, 0.78);
      color: white;

      font-size: 12px;

      pointer-events: none;

      opacity: 0;

      transition: opacity 0.2s ease;
    }

    .status.show {
      opacity: 1;
    }

    /* =====================================================
       MOBILE OVERLAY
       ===================================================== */

    .sidebar-overlay {
      display: none;

      position: fixed;

      top: 58px;
      left: 0;
      right: 0;
      bottom: 0;

      background: rgba(0, 0, 0, 0.45);

      z-index: 100;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 768px) {

      .menu-toggle {
        display: block;
      }

      .navbar {
        padding: 0 10px;
      }

      .title {
        font-size: 16px;
      }

      .nav-right {
        gap: 5px;
      }

      .nav-right .btn {
        padding: 7px 9px;
      }

      .sidebar {
        position: fixed;

        top: 58px;
        left: 0;
        bottom: 0;

        width: min(330px, 88vw);
        min-width: 0;

        transform: translateX(-105%);

        box-shadow: 4px 0 15px rgba(0, 0, 0, 0.4);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar.open ~ .sidebar-overlay {
        display: block;
      }
    }

    @media (max-width: 480px) {

      .title {
        display: none;
      }

      .nav-right .theme-button {
        font-size: 0;
      }

      .nav-right .theme-button::before {
        content: "🌓";
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       NAVBAR
       ===================================================== -->

  <header class="navbar">

    <div class="nav-left">

      <button
        class="menu-toggle"
        onclick="toggleSidebar()"
        aria-label="Open menu"
      >
        ☰
      </button>

      <div class="title">
        Super Desmos Advanced
      </div>

    </div>

    <div class="nav-right">

      <button
        class="btn theme-button"
        onclick="toggleTheme()"
      >
        🌓 Theme
      </button>

      <button
        class="btn btn-primary"
        onclick="saveGraph()"
      >
        💾 Save
      </button>

      <button
        class="btn"
        onclick="loadGraph()"
      >
        📂 Load
      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="main-container">

    <!-- ===================================================
         SIDEBAR
         =================================================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <!-- Dynamic -->

      <section class="category">

        <div class="category-title">
          Dynamic & Animations
        </div>

        <div class="preset-grid">

          <button
            class="btn"
            onclick="loadPreset('animation')"
          >
            🌊 Wave Slider
          </button>

          <button
            class="btn"
            onclick="loadPreset('table')"
          >
            📊 Data Table
          </button>

        </div>

      </section>


      <!-- Calculus -->

      <section class="category">

        <div class="category-title">
          Calculus
        </div>

        <div class="preset-grid">

          <button
            class="btn"
            onclick="loadPreset('derivative')"
          >
            📈 Derivatives
          </button>

          <button
            class="btn"
            onclick="loadPreset('integral')"
          >
            ∫ Integrals
          </button>

        </div>

      </section>


      <!-- Statistics -->

      <section class="category">

        <div class="category-title">
          Statistics
        </div>

        <div class="preset-grid">

          <button
            class="btn"
            onclick="loadPreset('normal')"
          >
            🔔 Normal Dist.
          </button>

          <button
            class="btn"
            onclick="loadPreset('regression')"
          >
            📉 Regression
          </button>

        </div>

      </section>


      <!-- Geometry -->

      <section class="category">

        <div class="category-title">
          Advanced Geometry
        </div>

        <div class="preset-grid">

          <button
            class="btn"
            onclick="loadPreset('parametric')"
          >
            🌀 Parametric
          </button>

          <button
            class="btn"
            onclick="loadPreset('implicit')"
          >
            ❤️ Implicit
          </button>

        </div>

      </section>


      <!-- Quick Actions -->

      <section class="category">

        <div class="category-title">
          Quick Actions
        </div>

        <div class="preset-grid">

          <button
            class="btn"
            onclick="resetGraph()"
          >
            🧹 Clear
          </button>

          <button
            class="btn"
            onclick="resetView()"
          >
            🔍 Reset View
          </button>

        </div>

      </section>

    </aside>


    <!-- Mobile overlay -->

    <div
      class="sidebar-overlay"
      onclick="toggleSidebar()"
    ></div>


    <!-- ===================================================
         DESMOS CALCULATOR
         =================================================== -->

    <section class="plot-container">

      <div id="calculator"></div>

      <div
        class="status"
        id="status"
      ></div>

    </section>

  </main>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

    /* =====================================================
       GLOBAL VARIABLES
       ===================================================== */

    const calculatorElement =
      document.getElementById("calculator");

    const statusElement =
      document.getElementById("status");

    let calculator = null;

    let isDark = true;

    let statusTimer = null;


    /* =====================================================
       INITIALIZE DESMOS
       ===================================================== */

    function initializeCalculator() {

      /*
        Check whether Desmos API loaded.
      */

      if (typeof Desmos === "undefined") {

        showStatus(
          "❌ Desmos load nahi hua. API key check karo.",
          5000
        );

        console.error(
          "Desmos API not available. Check your API key and internet connection."
        );

        return;
      }


      /*
        Create calculator.
      */

      calculator =
        Desmos.GraphingCalculator(
          calculatorElement,
          {
            expressions: true,
            keypad: true,
            settingsMenu: true,
            zoomButtons: true,
            expressionsTopbar: true,
            border: false,
            invertedColors: true,
            autosize: true
          }
        );


      /*
        Default graph bounds.
      */

      calculator.setMathBounds({
        left: -10,
        right: 10,
        bottom: -10,
        top: 10
      });


      showStatus(
        "✅ Desmos ready!",
        2500
      );

    }


    /* =====================================================
       STATUS MESSAGE
       ===================================================== */

    function showStatus(
      message,
      duration = 2500
    ) {

      statusElement.textContent = message;

      statusElement.classList.add("show");

      clearTimeout(statusTimer);

      statusTimer =
        setTimeout(
          function () {

            statusElement.classList.remove("show");

          },
          duration
        );

    }


    /* =====================================================
       THEME
       ===================================================== */

    function toggleTheme() {

      isDark = !isDark;

      document.body.setAttribute(
        "data-theme",
        isDark ? "dark" : "light"
      );


      if (calculator) {

        calculator.updateSettings({
          invertedColors: isDark
        });

      }


      showStatus(
        isDark
          ? "🌙 Dark theme"
          : "☀️ Light theme"
      );

    }


    /* =====================================================
       SAVE GRAPH
       ===================================================== */

    function saveGraph() {

      if (!calculator) {

        showStatus(
          "❌ Calculator ready nahi hai."
        );

        return;
      }


      try {

        const state =
          calculator.getState();


        localStorage.setItem(
          "super_desmos_state",
          JSON.stringify(state)
        );


        showStatus(
          "✅ Graph save ho gaya!"
        );

      }

      catch (error) {

        console.error(error);

        showStatus(
          "❌ Graph save nahi ho paya."
        );

      }

    }


    /* =====================================================
       LOAD GRAPH
       ===================================================== */

    function loadGraph() {

      if (!calculator) {

        showStatus(
          "❌ Calculator ready nahi hai."
        );

        return;
      }


      const saved =
        localStorage.getItem(
          "super_desmos_state"
        );


      if (!saved) {

        showStatus(
          "⚠️ Koi saved graph nahi mila."
        );

        return;
      }


      try {

        const state =
          JSON.parse(saved);


        calculator.setState(state);


        showStatus(
          "✅ Saved graph load ho gaya!"
        );

      }

      catch (error) {

        console.error(error);

        showStatus(
          "❌ Saved graph load nahi ho paya."
        );

      }

    }


    /* =====================================================
       CLEAR GRAPH
       ===================================================== */

    function resetGraph() {

      if (!calculator) return;

      calculator.setBlank();

      showStatus(
        "🧹 Graph clear ho gaya."
      );

    }


    /* =====================================================
       RESET VIEW
       ===================================================== */

    function resetView() {

      if (!calculator) return;

      calculator.setMathBounds({
        left: -10,
        right: 10,
        bottom: -10,
        top: 10
      });

      showStatus(
        "🔍 View reset ho gaya."
      );

    }


    /* =====================================================
       MOBILE SIDEBAR
       ===================================================== */

    function toggleSidebar() {

      const sidebar =
        document.getElementById("sidebar");

      sidebar.classList.toggle("open");

    }


    /* =====================================================
       CLOSE SIDEBAR AFTER PRESET
       ===================================================== */

    function closeMobileSidebar() {

      if (window.innerWidth <= 768) {

        const sidebar =
          document.getElementById("sidebar");

        sidebar.classList.remove("open");

      }

    }


    /* =====================================================
       PRESET LOADER
       ===================================================== */

    function loadPreset(type) {

      if (!calculator) {

        showStatus(
          "❌ Calculator ready nahi hai."
        );

        return;
      }


      /*
        Clear existing expressions.
      */

      calculator.setBlank();


      /* =================================================
         WAVE ANIMATION
         ================================================= */

      if (type === "animation") {

        calculator.setExpressions([

          {
            id: "wave",
            latex: "y=a\\sin(bx-c)"
          },

          {
            id: "a",
            latex: "a=2",
            sliderBounds: {
              min: -5,
              max: 5,
              step: 0.1
            }
          },

          {
            id: "b",
            latex: "b=3",
            sliderBounds: {
              min: 0.1,
              max: 10,
              step: 0.1
            }
          },

          {
            id: "c",
            latex: "c=0",
            sliderBounds: {
              min: 0,
              max: "2\\pi",
              step: 0.1
            }
          }

        ]);


        /*
          Start animation.
        */

        calculator.setExpression({
          id: "c",
          playing: true
        });

      }


      /* =================================================
         DATA TABLE
         ================================================= */

      else if (type === "table") {

        calculator.setExpressions([

          {
            type: "table",

            columns: [

              {
                latex: "x_1",

                values: [
                  "1",
                  "2",
                  "3",
                  "4",
                  "5"
                ]
              },

              {
                latex: "y_1",

                values: [
                  "2",
                  "4",
                  "5",
                  "4",
                  "6"
                ]
              }

            ]

          },

          {
            id: "fit",
            latex: "y_1\\sim m x_1+b"
          }

        ]);

      }


      /* =================================================
         DERIVATIVE
         ================================================= */

      else if (type === "derivative") {

        calculator.setExpressions([

          {
            id: "f",
            latex: "f(x)=x^3-4x"
          },

          {
            id: "df",
            latex: "y=f'(x)"
          },

          {
            id: "second",
            latex: "y=f''(x)"
          }

        ]);

      }


      /* =================================================
         INTEGRAL
         ================================================= */

      else if (type === "integral") {

        calculator.setExpressions([

          {
            id: "g",
            latex: "g(x)=\\sin(x)"
          },

          {
            id: "int",
            latex: "y=\\int_0^x g(t)dt"
          }

        ]);

      }


      /* =================================================
         NORMAL DISTRIBUTION
         ================================================= */

      else if (type === "normal") {

        calculator.setExpressions([

          {
            id: "dist",

            latex:
              "y=\\frac{1}{\\sigma\\sqrt{2\\pi}}e^{-\\frac{1}{2}\\left(\\frac{x-\\mu}{\\sigma}\\right)^2}"
          },

          {
            id: "mu",

            latex: "\\mu=0",

            sliderBounds: {
              min: -5,
              max: 5,
              step: 0.1
            }
          },

          {
            id: "sigma",

            latex: "\\sigma=1",

            sliderBounds: {
              min: 0.1,
              max: 5,
              step: 0.1
            }
          }

        ]);

      }


      /* =================================================
         REGRESSION
         ================================================= */

      else if (type === "regression") {

        calculator.setExpressions([

          {
            type: "table",

            columns: [

              {
                latex: "x_2",

                values: [
                  "-2",
                  "-1",
                  "0",
                  "1",
                  "2"
                ]
              },

              {
                latex: "y_2",

                values: [
                  "3",
                  "1",
                  "2",
                  "5",
                  "8"
                ]
              }

            ]

          },

          {
            id: "reg",
            latex: "y_2\\sim a x_2^2+b x_2+c"
          }

        ]);

      }


      /* =================================================
         PARAMETRIC
         ================================================= */

      else if (type === "parametric") {

        calculator.setExpressions([

          {
            id: "para",
            latex: "(\\sin(a t),\\cos(b t))"
          },

          {
            id: "a",

            latex: "a=3",

            sliderBounds: {
              min: 1,
              max: 10,
              step: 1
            }
          },

          {
            id: "b",

            latex: "b=2",

            sliderBounds: {
              min: 1,
              max: 10,
              step: 1
            }
          }

        ]);

      }


      /* =================================================
         IMPLICIT HEART
         ================================================= */

      else if (type === "implicit") {

        calculator.setExpressions([

          {
            id: "heart",

            latex:
              "(x^2+y^2-1)^3-x^2y^3=0",

            color: Desmos.Colors.RED
          }

        ]);


        calculator.setMathBounds({
          left: -1.5,
          right: 1.5,
          bottom: -1.5,
          top: 1.5
        });

      }


      else {

        showStatus(
          "⚠️ Unknown preset."
        );

        return;

      }


      showStatus(
        "✅ " + type + " loaded!"
      );


      closeMobileSidebar();

    }


    /* =====================================================
       RESIZE
       ===================================================== */

    window.addEventListener(
      "resize",
      function () {

        if (calculator) {
          calculator.resize();
        }

      }
    );


    /* =====================================================
       START APP
       ===================================================== */

    window.addEventListener(
      "load",
      function () {

        initializeCalculator();

      }
    );

  </script>

</body


</html>
