<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Project - Graphing Calculator</title>
  <!-- Desmos API script -->
  <script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=d322203be4f22e3278d4da15db9a05a8"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background-color: #f4f6f8; }
    
    /* Left Customizing UI Sidebar */
    .sidebar { width: 320px; background: #ffffff; padding: 20px; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; gap: 15px; }
    .sidebar h2 { font-size: 20px; color: #333; margin-bottom: 10px; }
    .input-group { display: flex; flex-direction: column; gap: 5px; }
    .input-group label { font-size: 14px; color: #666; font-weight: 600; }
    .input-group input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; }
    .btn { background: #007bff; color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #0056b3; }
    
    /* Right Plotting Area */
    .plot-container { flex: 1; height: 100vh; }
    #calculator { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <!-- Left Sidebar Controls -->
  <div class="sidebar">
    <h2>Graph Controls</h2>
    <div class="input-group">
      <label for="eqInput">Equation (e.g., y = x^2 or y = sin(x))</label>
      <input type="text" id="eqInput" placeholder="Enter equation..." value="y = x^2">
    </div>
    <button class="btn" onclick="plotEquation()">Plot Graph</button>
  </div>

  <!-- Right Plotting Area -->
  <div class="plot-container">
    <div id="calculator"></div>
  </div>

  <script>
    // Initialize Desmos Calculator
    var elt = document.getElementById('calculator');
    var calculator = Desmos.GraphingCalculator(elt, { expressions: true, settingsMenu: false });

    // Set Default Graph
    calculator.setExpression({ id: 'graph1', latex: 'y=x^2' });

    // Function to update graph from input
    function plotEquation() {
      var eq = document.getElementById('eqInput').value;
      if (eq.trim() !== "") {
        calculator.setExpression({ id: 'graph1', latex: eq });
      }
    }
  </script>
</body>
</html>
